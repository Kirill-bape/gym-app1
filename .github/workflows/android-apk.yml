name: Android APK

# Собирает APK на серверах GitHub и выкладывает его в Releases.
# Запускается при каждом пуше в main или вручную (Actions → Android APK → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Фиксируем образ: ubuntu-latest с 19.10.2026 переезжает на Ubuntu 26
    runs-on: ubuntu-24.04
    env:
      # Номер сборки попадает в приложение (проверка обновлений) и в versionCode
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      # Только ARM-процессоры (это все телефоны), APK получается почти вдвое меньше
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk forma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: forma-apk
          path: forma.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Форма, сборка ${{ github.run_number }}
          body: Скачай forma.apk на Android-телефон и установи. Если «Форма» уже стоит, она обновится, данные сохранятся.
          files: forma.apk
